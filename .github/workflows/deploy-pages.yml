name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble public site artifact
        run: |
          mkdir -p public
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.secrets/' \
            --exclude='payment-service/' \
            --exclude='steam-worker/' \
            --exclude='telegram-news/' \
            --exclude='*.test.js' \
            --exclude='*.service' \
            --exclude='*.toml' \
            --exclude='README.md' \
            --exclude='SITE_STRUCTURE.md' \
            --exclude='scrubber-3d-website.zip' \
            --exclude='public/' \
            ./ public/
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
